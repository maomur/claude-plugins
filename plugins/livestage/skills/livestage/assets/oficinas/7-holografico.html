t;20&quot; fill=&quot;none&quot; stroke=&quot;#2FD3A4&quot; stroke-width=&quot;2.5&quot; stroke-opacity=&quot;.55&quot;/%3E%3Cpath d=&quot;M52 99c0-10 6-15 12-15s12 5 12 15z&quot; fill=&quot;#2FD3A4&quot;/%3E%3Ccircle cx=&quot;64&quot; cy=&quot;75&quot; r=&quot;8&quot; fill=&quot;#2FD3A4&quot;/%3E%3C/g%3E%3Ccircle cx=&quot;102&quot; cy=&quot;26&quot; r=&quot;11&quot; fill=&quot;#FF4D5E&quot; fill-opacity=&quot;.22&quot;/%3E%3Ccircle cx=&quot;102&quot; cy=&quot;26&quot; r=&quot;6&quot; fill=&quot;#FF4D5E&quot;/%3E%3C/g%3E%3C/svg%3E">

<style>
/* Layout: plano cenital en pixel art a escala entera, barra de simulación fija y, debajo, ficha de la persona elegida + quién se sienta en cada zona. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#1B2130; --muted:#5A6376; --line:#D4D9E2;
  --accent:#1F6F62; --accent-soft:#DDEFEA;
  --ok:#2C8F54; --warn:#B57A0C; --bad:#C63F33;
  --tag-bg:rgba(255,255,255,.88); --tag-fg:#1B2130; --tag-line:rgba(27,33,48,.35);
  --frame:#1B2130; --fl-bg:#1B2130; --fl-fg:#FFD23F;
  --f-display:"Orbitron", "Share Tech Mono", ui-monospace, monospace;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151E; --surface:#191F2C; --ink:#E6E9F0; --muted:#9BA4B6; --line:#2A3244;
  --accent:#55C2A9; --accent-soft:#183A35; --ok:#5BC984; --warn:#E3AE3F; --bad:#EF6F62;
  --frame:#000000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151E; --surface:#191F2C; --ink:#E6E9F0; --muted:#9BA4B6; --line:#2A3244;
  --accent:#55C2A9; --accent-soft:#183A35; --ok:#5BC984; --warn:#E3AE3F; --bad:#EF6F62;
  --frame:#000000; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{padding-block:40px 24px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1;margin:10px 0 14px;letter-spacing:.01em;text-wrap:balance}
.lede{max-width:66ch;color:var(--muted);margin:0}
.lede strong{color:var(--ink);font-weight:600}

.simbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-block:1px solid var(--line)}
.simbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding-block:12px}
button.play{font-family:var(--f-display);font-size:16px;font-weight:700;background:var(--accent);color:var(--surface);border:0;padding:9px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);letter-spacing:.02em}
button.play:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button.play:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button.toggle{font-family:var(--f-mono);font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line);padding:7px 10px;cursor:pointer}
button.toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.log{flex:1 1 320px;min-width:0;font-family:var(--f-mono);font-size:13px}
.log.live{font-family:var(--f-body);font-size:16px;font-weight:600}
.log.live .step{font-family:var(--f-mono);font-weight:500;font-size:13px}
.log .step{color:var(--muted);margin-right:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:5px;background:var(--c)}

.plan-wrap{padding-block:28px 8px}
.plan{position:relative;margin:0 auto;max-width:100%;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(92,225,255,.45), 0 0 34px rgba(92,225,255,.28), 0 18px 40px rgba(4,10,22,.5)}
.plan canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;pointer-events:none}
.zone{position:absolute;transform:translateY(0);font-family:var(--f-mono);font-size:max(9px,calc(3.1px * var(--s)));letter-spacing:.06em;text-transform:uppercase;background:var(--tag-bg);color:var(--tag-fg);padding:1px 5px;white-space:nowrap;border:1px solid var(--tag-line)}
.pin{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);width:max(24px,calc(10px * var(--s)));height:max(24px,calc(10px * var(--s)));background:transparent;border:0;padding:0;cursor:pointer;border-radius:50%}
.pin:focus-visible{outline:3px solid #FFD23F;outline-offset:0}
.pin .tag{position:absolute;left:50%;bottom:calc(100% - 2px);transform:translateX(-50%);font-family:var(--f-display);font-weight:700;font-size:max(10px,calc(3.6px * var(--s)));line-height:1.1;white-space:nowrap;background:var(--tag-bg);color:var(--tag-fg);padding:1px 5px;border:1px solid var(--tag-line);pointer-events:none}
.plan:not(.names) .pin .tag{display:none}
.plan:not(.names) .pin:hover .tag,.plan:not(.names) .pin:focus-visible .tag,.plan:not(.names) .pin[aria-pressed="true"] .tag{display:block}
.pin .st{display:none;font-family:var(--f-mono);font-weight:500;font-size:.72em;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.pin[data-state="working"] .st,.pin[data-state="blocked"] .st{display:inline}
.plan.running .pin .tag{display:none}
.plan .pin[data-state="working"] .tag,.plan .pin[data-state="blocked"] .tag{display:block;z-index:3;font-size:max(13px,calc(4.6px * var(--s)));padding:2px 8px;box-shadow:3px 3px 0 #1B2130;animation:salto .9s ease-in-out infinite}
.plan .pin[data-state="working"] .tag::after,.plan .pin[data-state="blocked"] .tag::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:inherit;border-bottom:0}
.pin[data-state="working"] .tag::after{border-top-color:#1F6F62}
.pin[data-state="blocked"] .tag::after{border-top-color:#C63F33}
@keyframes salto{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
@media (prefers-reduced-motion: reduce){.plan .pin .tag{animation:none!important}}
.pin[data-state="working"] .tag{background:#1F6F62;color:#FFFFFF;border-color:#1F6F62}
.pin[data-state="blocked"] .tag{background:#C63F33;color:#FFFFFF;border-color:#C63F33}
.pop{position:absolute;pointer-events:auto;z-index:6;width:min(310px,86vw);background:var(--surface);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 14px 12px;font-size:13.5px;line-height:1.45}
.pop-head{display:flex;align-items:flex-start;gap:10px}
.pop-head h3{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;margin:0;flex:1;min-width:0}
.pop-head .role{display:block;font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
.pop-close{background:transparent;border:1px solid var(--line);color:var(--ink);width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1;flex:none}
.pop .chipst{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor;color:var(--muted);margin:8px 0 6px}
.pop .chipst[data-s="working"],.lg li[data-s="working"] .t{color:var(--accent)}
.pop .chipst[data-s="blocked"],.lg li[data-s="blocked"] .t{color:var(--bad)}
.pop .chipst[data-s="waiting"],.lg li[data-s="waiting"] .t{color:var(--warn)}
.pop .chipst[data-s="done"],.lg li[data-s="done"] .t{color:var(--ok)}
.pop .lbl,.ficha .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 3px}
.pop .now{font-weight:600}
.pop .mod{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);word-break:break-word}
.lg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.pop .lg{max-height:150px;overflow-y:auto}
.lg li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.lg .t{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.lg .empty{display:block;color:var(--muted)}
.flight{position:absolute;z-index:4;transform:translate(-50%,calc(-100% - 6px * var(--s)));font-family:var(--f-mono);font-weight:500;font-size:max(10px,calc(3.3px * var(--s)));white-space:nowrap;background:var(--fl-bg);color:var(--fl-fg);padding:2px 7px;pointer-events:none;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.plan .pin .tag{background:rgba(4,10,22,.86);color:#7DF9FF;border:1px solid rgba(92,225,255,.7);font-size:max(9px,calc(2.9px * var(--s)));letter-spacing:.06em;text-shadow:0 0 6px rgba(92,225,255,.8);box-shadow:0 0 10px rgba(92,225,255,.35)}
.plan .pin[data-state="working"] .tag{background:rgba(4,22,18,.9);color:#4DFFB0;border-color:#4DFFB0;box-shadow:0 0 14px rgba(77,255,176,.55);text-shadow:0 0 6px rgba(77,255,176,.8)}
.plan .pin[data-state="blocked"] .tag{background:rgba(30,6,12,.9);color:#FF4D6A;border-color:#FF4D6A;box-shadow:0 0 14px rgba(255,77,106,.55);text-shadow:0 0 6px rgba(255,77,106,.8)}
.plan .pin[data-state="working"] .tag::after{border-top-color:#4DFFB0}.plan .pin[data-state="blocked"] .tag::after{border-top-color:#FF4D6A}
.plan .flight{background:rgba(4,10,22,.88);color:#FFC14D;border:1px solid rgba(255,193,77,.7);box-shadow:0 0 10px rgba(255,193,77,.4)}
.plan .pop{background:rgba(6,16,32,.94);color:#D8F7FF;border:1px solid rgba(92,225,255,.7);box-shadow:0 0 24px rgba(92,225,255,.35);backdrop-filter:blur(4px)}
.plan .pop .pop-head h3{color:#7DF9FF;text-shadow:0 0 8px rgba(92,225,255,.7);font-size:15px}
.plan .pop .lbl,.plan .pop .mod,.plan .pop .role,.plan .pop .lg .t{color:rgba(160,220,240,.7)}
.plan .pop-close{color:#7DF9FF;border-color:rgba(92,225,255,.5)}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}
.pin[data-state="done"] .tag{background:#2C8F54;color:#FFFFFF;border-color:#2C8F54}
.pin[data-state="waiting"] .tag{background:#B57A0C;color:#FFFFFF;border-color:#B57A0C}
.plan-note{font-size:13px;color:var(--muted);text-align:center;margin:18px auto 0;max-width:70ch}

.details{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;padding-block:32px 8px}
@media (max-width:820px){.details{grid-template-columns:1fr}}
.ficha{background:var(--surface);border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ficha .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ficha h2{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.ficha .meta{font-size:13.5px;color:var(--muted)}
.ficha .role{font-weight:600}
.ficha .mod{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-word}
.ficha .seat{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;font-size:14px}
.ficha dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.ficha dt{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.ficha dd{margin:0;min-width:0}
.ficha blockquote{margin:4px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-style:italic}
.ficha blockquote::before{content:"“";font-family:var(--f-display);color:var(--accent)}
.ficha blockquote::after{content:"”";font-family:var(--f-display);color:var(--accent)}
.swatch{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.swatch i{width:12px;height:12px;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}

.zones{min-width:0}
.zones h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0 0 12px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.zones ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.zones li{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.zones .zname{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-body);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:4px 10px 4px 6px;cursor:pointer}
.chip i{width:12px;height:12px;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.chip:hover{border-color:var(--accent)}
.zones .empty{font-size:13.5px;color:var(--muted)}
footer{padding-block:40px 56px;color:var(--muted);font-size:13px}
/* Pantalla completa por defecto: solo la barra de simulación y la escena, sin cabecera ni textos */
html,body{height:100%}
body{margin:0;overflow:hidden;display:flex;flex-direction:column}
.details{display:none}
.simbar{position:relative;flex:none}
.simbar .wrap{max-width:none}
main.wrap{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0;display:flex}
.plan-wrap{flex:1;min-width:0;min-height:0;padding:0;display:flex;align-items:center;justify-content:center}
/* Foco en quien trabaja: el resto se oscurece y un anillo late a su alrededor */
.spot{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .35s ease}
.spot.on{opacity:1}
.spot .ring{fill:none;stroke:#2FD3A4;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:latido 1.1s ease-in-out infinite}
.spot .ring2{fill:none;stroke:#FFFFFF;stroke-width:1.5;stroke-opacity:.85}
@keyframes latido{0%,100%{transform:scale(1);stroke-opacity:1}50%{transform:scale(1.14);stroke-opacity:.45}}
.plan .pin[data-state="working"] .tag{box-shadow:0 0 0 3px rgba(47,211,164,.5),0 0 22px 4px rgba(47,211,164,.85)}
@media (prefers-reduced-motion: reduce){.spot .ring{animation:none}.spot{transition:none}}
/* Fin del Job: cartel grande, confeti con los colores del equipo y un aviso sonoro */
.fin{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(6,10,20,.55);pointer-events:auto;overflow:hidden;animation:finFondo .4s ease both}
.fin[hidden]{display:none}
.fin-card{position:relative;z-index:2;text-align:center;background:#FFFFFF;color:#14202E;border-radius:18px;padding:28px 36px 24px;max-width:min(460px,88%);box-shadow:0 0 0 4px #2FD3A4,0 24px 60px rgba(0,0,0,.45);animation:finEntra .55s cubic-bezier(.2,1.4,.4,1) both}
.fin-ok{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;background:#1FA97E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;line-height:1;box-shadow:0 0 0 8px rgba(47,211,164,.25)}
.fin-card h2{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0 0 8px;color:#14202E}
.fin-job{font-size:15px;margin:0 0 6px;color:#14202E}
.fin-stats{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;color:#5A6676;margin:0 0 18px}
.fin-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fin-btns button{font-family:var(--f-display);font-weight:700;font-size:15px;border-radius:999px;padding:9px 18px;cursor:pointer;border:2px solid #1FA97E}
.fin-btns .fin-again{background:#1FA97E;color:#FFFFFF}
.fin-btns .fin-close{background:transparent;color:#1F6F62}
.fin-btns button:focus-visible{outline:3px solid #14202E;outline-offset:2px}
.fin i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;z-index:1;animation:finCae linear forwards}
.simbar.fin-on .progress i{background:#2FD3A4;box-shadow:0 0 12px #2FD3A4}
.log.fin-log{color:#1FA97E;font-weight:700}
@keyframes finFondo{from{opacity:0}to{opacity:1}}
@keyframes finEntra{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
@keyframes finCae{to{transform:translate(var(--dx),calc(100vh + 40px)) rotate(var(--rot))}}
@media (prefers-reduced-motion: reduce){.fin,.fin-card{animation:none}.fin i{display:none}}
/* Selector de estilo, arriba a la derecha */
.estilo{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto}
.estilo select{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;max-width:200px}
.estilo select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* Charlas en las pausas */

<script>
if(!window.OFICINA){document.body.innerHTML='<p style="padding:24px;font:16px system-ui">Falta el archivo <b>datos.js</b> en la misma carpeta que esta página.</p>';throw new Error('Falta datos.js');}
const OFICINA=window.OFICINA, EMPRESA=OFICINA.empresa||'', JOB=OFICINA.job||{nombre:'',resumen:''};
const salaNombre=k=>(OFICINA.ZONES||[]).filter(z=>z.sala===k).map(z=>z.name).join(' · ');   // si dos áreas comparten sala, salen las dos
document.title=(EMPRESA?'Oficina de '+EMPRESA+' · ':'')+'Holográfico';
/* ---------- Personas (mismas fichas que el reparto) ---------- */
const T = OFICINA.T;
const PRIMERA=(OFICINA.primera&&T[OFICINA.primera])?OFICINA.primera:Object.keys(T)[0];

/* Puesto de cada persona en el plano (coordenadas en píxeles del plano, mirando hacia su mesa) */
const SEAT = OFICINA.SEAT;
for(const q of Object.values(SEAT))if(q.x===320&&q.y===36){q.x=326;q.y=48;}   // el puesto del estudio se centró en su sala
const OCUPA=(x,y)=>Object.values(SEAT).some(q=>q.x===x&&q.y===y);
const TRIPS={};   // quién está fuera de su mesa (ver «Vida en la oficina»)
function where(id){const tr=TRIPS[id];return tr?tr.pos:SEAT[id];}

const ZONES = OFICINA.ZONES;

/* ---------- Proyección holográfica ---------- */
// Mismas coordenadas que la versión cenital (384 × 256). Margen para el marcador (HUD).
const W=440, H=326, OX=28, OY=40;
const cv=document.getElementById('plano'), mainCtx=cv.getContext('2d');
let ctx=mainCtx, S=0, hudStep=0;
const bg=document.createElement('canvas');
const CY='#5CE1FF', CY2='rgba(92,225,255,.55)', CY3='rgba(92,225,255,.22)', MG='#FF4FD8', GR='#4DFFB0', AM='#FFC14D', RD='#FF4D6A', BGc='#040A16';
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,gg=(n>>8)&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return '#'+((1<<24)+(f(r)<<16)+(f(gg)<<8)+f(b)).toString(16).slice(1);}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b*S;}
function noGlow(){ctx.shadowBlur=0;}
function sr(x,y,w,h,lw,col,fill){ctx.beginPath();ctx.rect(x,y,w,h);if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw){ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.stroke();}}
function ln(x1,y1,x2,y2,lw,col,dash){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.lineCap='round';ctx.setLineDash(dash||[]);ctx.stroke();ctx.setLineDash([]);}
function cir(x,y,r,lw,col,fill,dash){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw){ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.setLineDash(dash||[]);ctx.stroke();ctx.setLineDash([]);}}
function arc(x,y,r,a0,a1,lw,col){ctx.beginPath();ctx.arc(x,y,r,a0,a1);ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.lineCap='round';ctx.stroke();}
function txt(s,x,y,size,col,align,font,weight){ctx.font=`${weight||500} ${size}px ${font==='d'?'"Orbitron", "Share Tech Mono", monospace':'"Share Tech Mono", ui-monospace, monospace'}`;ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function brackets(x,y,w,h,len,col,lw){for(const [cx,cy,dx,dy] of [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]]){ln(cx,cy,cx+dx*len,cy,lw,col);ln(cx,cy,cx,cy+dy*len,lw,col);}}

/* ---------- Mobiliario en línea de luz ---------- */
const FILL='rgba(92,225,255,.06)';
function desk(x,y,w,h){sr(x,y,w,h,.5,CY2,FILL);}
function monitor(x,y,w,face){glow(CY,4);sr(x,y,w,1.4,0,null,'rgba(140,240,255,.9)');noGlow();sr(x+1,face==='down'?y+3.4:y-5.2,w-2,1.8,.3,CY3);}
function laptop(x,y,face){sr(x,y,9,6,.4,CY2,FILL);glow(CY,3);ln(x,face==='down'?y+.8:y+5.2,x+9,face==='down'?y+.8:y+5.2,.7,CY);noGlow();}
function chair(x,y,dir){sr(x-3.4,y-3.4,6.8,6.8,.35,CY3);const b={up:[x-3.4,y+3.4,x+3.4,y+3.4],down:[x-3.4,y-3.4,x+3.4,y-3.4],right:[x-3.4,y-3.4,x-3.4,y+3.4],left:[x+3.4,y-3.4,x+3.4,y+3.4]}[dir];ln(b[0],b[1],b[2],b[3],1,CY2);}
function plant(x,y,r){r=r||4;cir(x,y,r*.4,.4,rgba(GR,.6));for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(x,y,r,r*.38,i*Math.PI/3,0,Math.PI*2);ctx.lineWidth=.3;ctx.strokeStyle=rgba(GR,.55);ctx.stroke();}}
function tall(x,y,w,h){sr(x,y,w,h,.5,CY2,FILL);const step=2;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.beginPath();for(let k=-h;k<w;k+=step){ctx.moveTo(x+k,y+h);ctx.lineTo(x+k+h,y);}ctx.lineWidth=.2;ctx.strokeStyle=CY3;ctx.stroke();ctx.restore();}
function paper(x,y){sr(x,y,5,6,.3,CY3);}

function drawScene(){
  // fondo con viñeta y rejilla de luz
  ctx.fillStyle=BGc;ctx.fillRect(-OX,-OY,W,H);
  const g=ctx.createRadialGradient(192,128,20,192,128,280);g.addColorStop(0,'rgba(20,70,120,.55)');g.addColorStop(1,'rgba(4,10,22,0)');ctx.fillStyle=g;ctx.fillRect(-OX,-OY,W,H);
  for(let x=0;x<=384;x+=8)ln(x,0,x,256,x%40===0?.25:.12,x%40===0?'rgba(92,225,255,.14)':'rgba(92,225,255,.05)');
  for(let y=0;y<=256;y+=8)ln(0,y,384,y,y%40===0?.25:.12,y%40===0?'rgba(92,225,255,.14)':'rgba(92,225,255,.05)');
  // sectores con su tono
  for(const [x,y,w,h,c] of [[4,4,116,76,CY],[4,82,116,90,CY],[4,175,116,77,GR],[124,4,146,164,CY],[124,175,146,77,AM],[273,4,107,76,MG],[272,83,108,91,CY],[273,177,107,75,GR]]){sr(x,y,w,h,0,null,rgba(c,.035));brackets(x+2,y+2,w-4,h-4,5,rgba(c,.5),.4);}
  // muros
  glow(CY,6);
  const wall=(x1,y1,x2,y2,lw)=>ln(x1,y1,x2,y2,lw||1.4,CY);
  wall(0,0,384,0);wall(0,0,0,256);wall(384,0,384,256);wall(0,256,30,256);wall(58,256,384,256);
  wall(271.5,4,271.5,81.5,1);wall(271.5,81.5,300,81.5,1);wall(318,81.5,384,81.5,1);
  wall(271.5,175.5,271.5,256,1);wall(271.5,175.5,300,175.5,1);wall(318,175.5,384,175.5,1);
  wall(0,173.5,62,173.5,1);wall(92,173.5,121,173.5,1);
  noGlow();
  for(const [x,w] of [[14,26],[56,40],[136,46],[200,52],[288,32],[338,34]]){ln(x,-1.6,x+w,-1.6,.5,CY2);for(let xx=x;xx<=x+w;xx+=4)ln(xx,-2.6,xx,-.6,.3,CY3);}
  glow(MG,5);ctx.setLineDash([2.4,1.4]);ln(121,4,121,82,.8,MG,[2.4,1.4]);ln(4,81,88,81,.8,MG,[2.4,1.4]);ln(106,81,121,81,.8,MG,[2.4,1.4]);ctx.setLineDash([]);noGlow();
  for(const [hx,hy,a] of [[88,81,-1],[300,81.5,-1],[300,175.5,1]]){ln(hx,hy,hx,hy+a*16,.5,CY2);ctx.beginPath();ctx.arc(hx,hy,16,0,a*Math.PI/2,a<0);ctx.setLineDash([1,1.4]);ctx.lineWidth=.3;ctx.strokeStyle=CY3;ctx.stroke();ctx.setLineDash([]);}
  glow(GR,5);ln(30,256,44,256,.9,GR);ln(44,257.6,58,257.6,.9,GR);noGlow();txt('ACCESO',44,262,2.8,rgba(GR,.8),'center');
  // alfombras como zonas de proyección
  for(const [x,y,w,h] of [[22,12,64,50],[140,104,122,58],[216,180,50,32]])sr(x,y,w,h,.3,CY3,null);

  /* Dirección */
  tall(5,8,7,42);desk(30,28,44,12);monitor(46,36,12,'up');sr(34,31,6,7,.3,CY2,'rgba(92,225,255,.25)');paper(64,31);
  chair(44,48,'up');chair(60,48,'up');cir(100,60,6,.5,CY2,FILL);cir(100,60,4,.25,CY3);chair(90,60,'right');chair(110,60,'left');plant(112,12,5);plant(12,70);
  /* Campo */
  for(let i=0;i<5;i++)tall(5,88+i*11,9,10);
  desk(20,96,28,11);monitor(28,97,10,'down');sr(50,98,7,7,.4,CY2,FILL);
  sr(62,83,34,5,.4,CY2,FILL);[GR,RD,CY,AM,MG,CY,AM,MG].forEach((c,i)=>{glow(c,3);sr(63.6+i*4,84.2,2.6,2.6,0,null,rgba(c,.8));});noGlow();
  desk(64,96,28,11);laptop(73,98,'down');paper(85,99);sr(95,109,6,7,.35,CY3);
  desk(60,140,36,19);sr(73,146,9,7,.45,CY2);
  for(const [sx,d] of [[53,1],[103,-1]]){sr(sx-4,136,8,8,.45,AM,rgba(AM,.12));ctx.globalAlpha=.25;ctx.beginPath();ctx.moveTo(sx+d*4,136);ctx.lineTo(sx+d*4,144);ctx.lineTo(77.5,152);ctx.lineTo(77.5,146);ctx.closePath();ctx.fillStyle=rgba(AM,.4);ctx.fill();ctx.globalAlpha=1;}
  plant(112,92);plant(112,163);
  /* Recepción */
  ctx.beginPath();ctx.moveTo(16,206);ctx.lineTo(76,206);ctx.lineTo(76,184);ctx.lineTo(83,184);ctx.lineTo(83,213);ctx.lineTo(16,213);ctx.closePath();ctx.fillStyle=rgba(GR,.07);ctx.fill();glow(GR,4);ctx.lineWidth=.6;ctx.strokeStyle=GR;ctx.stroke();noGlow();
  monitor(48,208,10,'up');chair(11,224,'right');chair(11,236,'right');cir(102,226,2.4,.35,CY3);plant(112,184,5);plant(110,242);
  /* Redacción */
  for(let i=0;i<11;i++){const c=[AM,MG,CY,GR][i%4];glow(c,3);sr(149+i*4.4,5.2,2.8,2,0,null,rgba(c,.75));}noGlow();
  desk(160,30,32,11);desk(196,30,32,11);desk(160,41,32,11);desk(196,41,32,11);ln(160,41,228,41,.8,CY2);
  monitor(171,36,10,'up');laptop(207,32,'up');monitor(171,43,10,'down');sr(186,44,5,7,.35,CY2);monitor(207,43,10,'down');sr(221,44,4,6,.35,CY2);
  tall(242,34,11,46);plant(130,88);plant(262,88);plant(262,12);
  /* Mesa larga: una mesa de proyección */
  sr(148,124,104,16,.7,CY,'rgba(92,225,255,.08)');glow(CY,4);ln(150,132,250,132,.25,CY3);noGlow();
  for(const sx of [166,200,234])paper(sx-3,125);for(const sx of [183,217])paper(sx-3,134);
  cir(200,132,2,.5,CY);
  for(const [x,w] of [[128,52],[196,66]]){sr(x,168,w,6,.4,rgba(GR,.5),rgba(GR,.05));for(let xx=x+3;xx<x+w-2;xx+=5)cir(xx,171,1.4,.25,rgba(GR,.5));}
  /* Office */
  sr(226,250.5,14,3,.4,CY,'rgba(92,225,255,.12)');txt('WC',233,246.6,2.8,CY,'center','d',700);
  sr(128,240,74,11,.5,rgba(AM,.6),rgba(AM,.05));sr(132,242,10,6,.3,CY3);sr(150,242,10,6,.3,CY3);sr(184,241,8,8,.4,rgba(RD,.7));sr(204,234,13,17,.5,CY2,FILL);
  cir(160,208,9,.5,rgba(AM,.6),rgba(AM,.05));chair(160,196,'down');chair(160,221,'up');chair(147,208,'right');chair(173,208,'left');
  sr(222,183,40,11,.5,rgba(MG,.7),rgba(MG,.08));sr(230,199,24,8,.4,CY2);cir(128,184,3,.4,CY2);plant(262,246,5);
  /* Estudio */
  desk(302,30,48,12);monitor(309,31,12,'down');monitor(325,31,12,'down');sr(340,34,8,6,.35,MG,rgba(MG,.15));
  sr(352,52,24,17,.45,rgba(GR,.7),rgba(GR,.06));for(let xx=356;xx<376;xx+=4)ln(xx,52,xx,69,.15,rgba(GR,.4));cir(290,64,6,.4,rgba(MG,.7),rgba(MG,.08));plant(374,12);
  /* Calidad */
  desk(300,104,36,12);monitor(313,105,10,'down');paper(302,106);cir(330,109,2,.4,CY);ln(331.4,110.4,334,113,.5,CY);
  sr(358,88,16,11,.45,CY2,FILL);glow(CY,3);sr(376,100,3,40,.4,CY,'rgba(92,225,255,.15)');noGlow();if(OCUPA(352,152)){desk(334,134,36,12);monitor(340,135,12,'down');}else{desk(344,140,26,14);chair(338,147,'right');chair(376,147,'left');}plant(278,164);plant(282,92);
  /* Administración */
  tall(320,179,44,6);desk(306,206,40,12);monitor(316,207,10,'down');sr(332,208,6,7,.35,rgba(GR,.8),rgba(GR,.15));
  sr(362,234,14,14,.6,RD,rgba(RD,.1));cir(369,241,2.4,.4,RD);plant(280,246,5);plant(372,186);

  // rótulos de sector
  const ROOMS=[['despacho','S-01',4,4,116,76,8,70],['izquierda','S-02',4,82,116,90,20,163],['recepcion','S-03',4,175,116,77,8,181],['isla','S-04',124,4,146,94,128,70],
    ['mesa-larga','S-05',124,98,146,70,128,101],['office','S-06',124,175,146,77,176,181],['arriba-derecha','S-07',273,4,107,76,306,72],['derecha','S-08',272,83,108,91,288,163],['abajo-derecha','S-09',273,177,107,75,276,191]];
  for(const [k,c,x,y,w,h,lx,ly] of ROOMS){const n=salaNombre(k).toUpperCase();
    ctx.font='700 6.8px "Orbitron", "Share Tech Mono", monospace';const fz=Math.min(6.8,6.8*(x+w-lx-4)/Math.max(1,ctx.measureText(n).width));
    glow(CY,3);txt(n,lx,ly-1.8,fz,CY,'left','d',700);noGlow();txt(`${c} · ${(w*h/400).toFixed(1).replace('.',',')} m²`,lx,ly+4.4,2.5,CY2);}
  // marco del HUD
  brackets(-20,-32,424,312,10,CY2,.6);
  glow(CY,4);txt((EMPRESA+' // CENTRO DE OPERACIONES').toUpperCase(),-14,-25,4.4,CY,'left','d',700);noGlow();
  txt('PROYECCIÓN CENITAL · 17 AGENTES · CANAL 07',-14,-19,2.8,CY2);
  for(let x=0;x<=384;x+=8)ln(x,262+6,x,262+(x%40===0?9:7.6),.3,CY3);
  txt('ESCALA · 1 CUADRO = 40 CM',0,275,2.5,CY2);
}

/* ---------- Agentes en holograma ---------- */
const STATES=['idle','waiting','working','blocked','done'];
const ids=Object.keys(T);
const state=Object.fromEntries(ids.map(id=>[id,'idle']));
const seeds=Object.fromEntries(ids.map((id,i)=>[id,i*7]));
let selected=PRIMERA, frame=0;
const AT=(x,y)=>ids.find(id=>SEAT[id].x===x&&SEAT[id].y===y)||'_';
const P_RECEP=AT(46,200), P_FOTO=AT(77,134), P_CAJA=AT(326,224);
const NATIVOS=ids.filter(id=>[[166,118],[200,118],[234,118],[183,146],[217,146]].some(([x,y])=>SEAT[id].x===x&&SEAT[id].y===y));
const SC={working:GR,blocked:RD,waiting:AM,done:'#7DF9FF'};
const DIRV={up:[0,-1],down:[0,1],right:[1,0],left:[-1,0]};
const initials=id=>{const w=T[id].name.split(' ').filter(s=>!/[«»]/.test(s));return (w[0][0]+w[w.length-1][0]).toUpperCase();};
function person(id){
  const p=where(id), t=T[id], st=state[id], f=(reduce?0:frame)+seeds[id], [fx,fy]=DIRV[p.dir];
  if(p.hide)return;
  const col=shade(t.color,lum(t.color)<.45?.45:.15);
  // disco proyector
  const rot=f*.12;
  ctx.globalAlpha=.8;for(let i=0;i<6;i++)arc(p.x,p.y,7.4,rot+i*Math.PI/3,rot+i*Math.PI/3+.6,.5,CY);ctx.globalAlpha=1;

  const t=performance.now();

  for(const id of Object.keys(TRIPS)){const tr=TRIPS[id];const dt=Math.min(.1,Math.max(0,(t-tr.last)/1000));tr.last=t;

    if(t<tr.t0)continue;                                     // aún no se ha levantado

  <div class="lbl">Registro del Job</div>${logHTML(id)}`;}
function placePop(id){const p=where(id);const sx=p.x+OX, sy=p.y+OY;
  pop.style.left=pct(sx,W);pop.style.top=pct(sy,H);
  const tx=sx<110?'-10%':sx>W-110?'-90%':'-50%';
  const ty=sy<H*0.5?'calc(10px * var(--s))':'calc(-100% - 12px * var(--s))';
  pop.style.transform=`translate(${tx}, ${ty})`;}
function openPop(id){popId=id;pop.innerHTML=popHTML(id);placePop(id);pop.hidden=false;
  pop.querySelector('.pop-close').addEventListener('click',closePop);}
function closePop(){popId=null;pop.hidden=true;}
function refreshPop(){if(popId){const sc=pop.querySelector('.lg')?.scrollTop||0;openPop(popId);const lg=pop.querySelector('.lg');if(lg)lg.scrollTop=sc;}}
document.addEventListener('click',e=>{if(popId&&!pop.contains(e.target))closePop();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&popId)closePop();});

const zoneList=document.getElementById('zoneList');
for(const z of ZONES){const li=document.createElement('li');

function fit(){
  const aw=wrapEl.clientWidth-24, ah=wrapEl.clientHeight-24;
  const cssW=Math.max(200,Math.min(aw,ah*W/H)), cssH=cssW*H/W;
  plan.style.width=cssW+'px';plan.style.height=cssH+'px';plan.style.setProperty('--s',cssW/384);
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);S=cv.width/W;
  buildBg();render();
}
fit();addEventListener('resize',fit);
/* Botón de pantalla completa del navegador (la página ya ocupa toda la ventana) */
const fsBtn=document.getElementById('fsBtn');
function syncFs(){const on=!!document.fullscreenElement;fsBtn.setAttribute('aria-pressed',String(on));fsBtn.textContent=on?'✕ Salir de pantalla completa':'⛶ Pantalla completa';}
if(!document.documentElement.requestFullscreen)fsBtn.hidden=true;
fsBtn.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){/* el navegador no lo permite: la página sigue ocupando la ventana */}});
document.addEventListener('fullscreenchange',()=>{syncFs();requestAnimationFrame(fit);});
/* Foco en quien trabaja: oscurece el resto de la oficina e ilumina a cada persona trabajando */
const SVGNS='http://www.w3.org/2000/svg';
const spot=document.createElementNS(SVGNS,'svg');spot.setAttribute('class','spot');spot.setAttribute('aria-hidden','true');
spot.innerHTML='<defs><radialGradient id="spotHole"><stop offset="50%" stop-color="#000"/><stop offset="100%" stop-color="#fff"/></radialGradient><mask id="spotMask" maskUnits="userSpaceOnUse"><rect width="100%" height="100%" fill="#fff"/><g class="holes"></g></mask></defs><rect width="100%" height="100%" fill="rgba(6,10,20,.3)" mask="url(#spotMask)"/><g class="rings"></g>';
overlay.insertBefore(spot,overlay.firstChild);
const holesG=spot.querySelector('.holes'), ringsG=spot.querySelector('.rings');
let spotKey=null;
function spotLoop(){
  const ids=Object.keys(pins).filter(id=>pins[id].dataset.state==='working'&&pins[id].style.visibility!=='hidden');
  spot.classList.toggle('on',ids.length>0);
  if(ids.length){
    const pr=plan.getBoundingClientRect(), r=Math.max(34,pr.width*.045);
    if(spotKey!==ids.join()){spotKey=ids.join();
      holesG.innerHTML=ids.map(()=>'<circle fill="url(#spotHole)"/>').join('');
      ringsG.innerHTML=ids.map(()=>'<circle class="ring2"/><circle class="ring"/>').join('');}
    ids.forEach((id,i)=>{const b=pins[id].getBoundingClientRect(), x=b.left+b.width/2-pr.left, y=b.top+b.height/2-pr.top+r*.2;
      const h=holesG.children[i];h.setAttribute('cx',x);h.setAttribute('cy',y);h.setAttribute('r',r*1.7);
      for(const c of [ringsG.children[2*i],ringsG.children[2*i+1]]){c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',r);}});

requestAnimationFrame(spotLoop);
const namesBtn=document.getElementById('names');
if(wrapEl.clientWidth<700){plan.classList.remove('names');namesBtn.setAttribute('aria-pressed','false');}
namesBtn.addEventListener('click',()=>{const on=plan.classList.toggle('names');namesBtn.setAttribute('aria-pressed',String(on));});

/* ---------- Simulación de un Job (la misma del reparto) ---------- */
const ST_TXT={working:'trabajando',blocked:'bloqueado'};
function setState(id,s){state[id]=s;pins[id].dataset.state=s;pins[id].querySelector('.st').textContent=ST_TXT[s]||'';}
const STEPS = OFICINA.STEPS;
/* Lo que hace cada persona en cada paso (índice del paso → persona → tarea) */
const ACT = OFICINA.ACT;
/* Entregas de cada paso: [quién envía, quién recibe, objeto, qué es] */
const HAND = OFICINA.HAND;
const playBtn=document.getElementById('play'), logEl=document.getElementById('log');
document.getElementById('estilo').addEventListener('change',e=>{location.href=e.target.value+location.search;});
/* Fin del Job: lo anuncia el jefe (quien está en el despacho de dirección, o «jefe» en datos.js) con el informe final */
const JEFE=(()=>{const j=OFICINA.jefe;if(j&&T[j])return j;const z=(OFICINA.ZONES||[]).find(z=>z.sala==='despacho'&&z.ids&&z.ids.length&&T[z.ids[0]]);if(z)return z.ids[0];
  return Object.keys(SEAT).find(k=>SEAT[k].x===52&&SEAT[k].y===22)||PRIMERA;})();
const fin=document.createElement('div');fin.className='fin';fin.hidden=true;fin.setAttribute('role','dialog');fin.setAttribute('aria-modal','false');fin.setAttribute('aria-labelledby','finTit');
fin.innerHTML='<div class="fin-card"><div class="fin-jefe"><span class="fin-av" aria-hidden="true"></span><div><div class="fin-quien"></div><div class="fin-dice"></div></div></div><h2 id="finTit">Job completado</h2><p class="fin-job"></p><table class="fin-tabla"></table><p class="fin-nota"></p><div class="fin-btns"><button type="button" class="fin-again">↻ Repetir</button><button type="button" class="fin-close">Cerrar</button></div></div>';
plan.appendChild(fin);
for(const ev of ['click','pointerdown','mousedown','touchstart','wheel'])fin.addEventListener(ev,e=>e.stopPropagation());
let jobT0=0;
function chime(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ac=new A(),t=ac.currentTime;
  [[523.25,0],[659.25,.12],[783.99,.24],[1046.5,.38]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.18,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.6);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.65);});
  setTimeout(()=>ac.close(),1500);}catch(e){}}
// info (opcional, p. ej. desde datos en directo): {ok, titulo, dice, sub, filas:[[etiqueta, valor, 'ok'|'mal'], …], nota}
function showDone(info){
  info=info||{};const ok=info.ok!==false;
  const secs=Math.max(1,Math.round((performance.now()-jobT0)/1000));
  const t=T[JEFE]||{name:'',role:'',short:'',color:'#1FA97E'};
  const av=fin.querySelector('.fin-av');av.textContent=String(t.short||t.name).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();av.style.background=t.color;
  fin.querySelector('.fin-quien').textContent=t.name+(t.role?' · '+t.role:'');
  fin.querySelector('.fin-dice').textContent='«'+(info.dice||(ok?'¡Equipo, job completado! Aquí tenéis el informe.':'El job se ha detenido. Esto es lo que ha quedado hecho.'))+'»';
  fin.querySelector('#finTit').textContent=info.titulo||(ok?'Job completado':'Job detenido');
  const tmp=document.createElement('div');tmp.innerHTML=INTRO;tmp.querySelector('.step')?.remove();
  fin.querySelector('.fin-job').textContent=info.sub!==undefined?info.sub:tmp.textContent.trim();
  const filas=info.filas||[...(OFICINA.informe||[['Pasos',STEPS.length],['Personas',ids.length]]),['Duración de la simulación',secs+' s']];
  fin.querySelector('.fin-tabla').innerHTML=filas.map(([k,v,tono])=>`<tr${tono?` data-t="${esc(tono)}"`:''}><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
  fin.querySelector('.fin-nota').textContent=info.nota||'';
  fin.classList.toggle('fin-mal',!ok);
  fin.querySelectorAll('i').forEach(e=>e.remove());
  if(ok){const cols=ids.map(id=>T[id].color);
    for(let k=0;k<70;k++){const c=document.createElement('i');c.style.left=(Math.random()*100)+'%';c.style.background=cols[k%cols.length];
      c.style.setProperty('--dx',(Math.random()*160-80)+'px');c.style.setProperty('--rot',(Math.random()*900-450)+'deg');
      c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=(Math.random()*.6)+'s';fin.appendChild(c);}}
  // foco sobre el jefe, que anuncia el final
  const pj=pins[JEFE];fin.classList.remove('con-jefe');
  if(pj){pj.classList.add('anuncia');pj.classList.toggle('mal',!ok);const b=pj.getBoundingClientRect(),r=plan.getBoundingClientRect();
    if(b.width&&pj.style.visibility!=='hidden'){fin.style.setProperty('--jx',(b.left+b.width/2-r.left)+'px');fin.style.setProperty('--jy',(b.top+b.height/2-r.top)+'px');fin.classList.add('con-jefe');}}
  fin.hidden=false;document.querySelector('.simbar').classList.add('fin-on');
  logEl.classList.add('fin-log');if(ok)chime();fin.querySelector('.fin-close').focus({preventScroll:true});
}
function hideDone(){fin.hidden=true;document.querySelector('.simbar').classList.remove('fin-on');logEl.classList.remove('fin-log');pins[JEFE]?.classList.remove('anuncia','mal');}
fin.querySelector('.fin-close').addEventListener('click',e=>{e.stopPropagation();hideDone();});
fin.querySelector('.fin-again').addEventListener('click',e=>{e.stopPropagation();hideDone();if(timer){stop();resetAll();}playBtn.click();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!fin.hidden)hideDone();});
const INTRO='<span class="step">Job</span>'+esc([JOB.nombre,JOB.resumen].filter(Boolean).join(' · '));
document.getElementById('log').innerHTML=INTRO;
const progEl=document.getElementById('prog');
function resetAll(){ids.forEach(id=>setState(id,'idle'));}
function stop(){clearTimeout(timer);timer=null;hudStep=0;clearFlights();playBtn.textContent='▶ Simular un Job';plan.classList.remove('running');logEl.classList.remove('live');progEl.style.width='0';render();}
function run(i){
  if(i>=STEPS.length){progEl.style.width='100%';showDone();timer=setTimeout(()=>{stop();resetAll();logEl.innerHTML='<span class="step">Fin</span>✓ Job completado. Pulsa «Simular un Job» para repetirlo.';},2500);return;}
  const [changes,msg,ms]=STEPS[i];
  const t=hora(clock);
  for(const [id,s] of Object.entries(changes)){
    setState(id,s);
    const own=ACT[i]&&ACT[i][id];
    const txt=s==='done'?(own||'Termina su parte y pasa el testigo.'):s==='waiting'?'Queda a la espera de la pluma para escribir.':s==='idle'?null:(own||msg);
    if(txt)LOG[id].push({t,st:s,msg:txt});
  }
  for(const [from,to,item,label] of (HAND[i]||[])){
    if(from!=='door')LOG[from].push({t,st:'done',msg:`Envía «${label}» a ${T[to].short}.`});
    LOG[to].push({t,st:'working',msg:from==='door'?`Recibe «${label}» por la puerta.`:`Recibe «${label}» de ${T[from].short}.`});
  }
  if(HAND[i])launch(HAND[i],ms);
  clock+=ms;
  refreshPop();if(selected)select(selected);
  logEl.innerHTML=`<span class="step">Paso ${i+1} de ${STEPS.length}</span>${esc(msg)}`;
  progEl.style.width=((i+1)/STEPS.length*100)+'%';hudStep=i+1;
  timer=setTimeout(()=>run(i+1),ms);
  render();
}
playBtn.addEventListener('click',()=>{
  hideDone();if(timer){stop();resetAll();logEl.innerHTML=INTRO;return;}
  resetAll();ids.forEach(id=>LOG[id].length=0);clock=0;
  playBtn.textContent='■ Detener';plan.classList.add('running');logEl.classList.add('live');
  timer=-1;jobT0=performance.now();run(0);
});

/* ---------- Conexión en directo con la aplicación (opcional) ----------
   Si datos.js trae  directo: { url: 'eventos' }, la oficina escucha esos eventos (Server-Sent Events)
   y el equipo se mueve con el trabajo real. Los manda la librería oficina-eventos.js desde la aplicación.
   Mientras no llegue ningún trabajo, la oficina sigue con la simulación de ejemplo. */
const DIRECTO={activo:false,fin:false};
if(OFICINA.directo&&OFICINA.directo.url&&window.EventSource){
  const hhmm=()=>new Date().toLocaleTimeString('es-ES',{hour12:false});
  const barra=(a,b)=>{logEl.innerHTML=`<span class="step">${esc(a||'')}</span>${esc(b||'')}`;};
  let cola=false;
  const refrescar=()=>{if(cola)return;cola=true;requestAnimationFrame(()=>{cola=false;refreshPop();if(selected)select(selected);if(typeof render==='function')render();});};
  const anota=(id,st,msg)=>{if(!msg||!LOG[id])return;const L=LOG[id],l=L[L.length-1];if(!l||l.msg!==msg||l.st!==st)L.push({t:hhmm(),st,msg});if(L.length>300)L.splice(0,L.length-300);};
  function limpiar(){if(timer)stop();hideDone();resetAll();ids.forEach(id=>LOG[id].length=0);}
  function enDirecto(){
    if(DIRECTO.activo)return;DIRECTO.activo=true;limpiar();
    playBtn.hidden=true;fin.querySelector('.fin-again').hidden=true;   // en directo no hay «Repetir»: el trabajo es real
    ahora=function(id){const st=state[id],L=LOG[id],l=L[L.length-1];
      if(st!=='idle'&&l)return l.msg;if(st==='waiting')return 'Esperando su turno.';if(st==='done')return 'Ya ha terminado su parte.';
      return DIRECTO.fin?'Sin trabajo en marcha ahora mismo.':'No interviene en este momento del trabajo.';};}
  function aplicar(e){
    switch(e.t){
      case 'inicio':
        if(DIRECTO.activo)limpiar();enDirecto();DIRECTO.fin=false;jobT0=performance.now();
        plan.classList.add('running');logEl.classList.add('live');progEl.style.width='0';
        barra('En marcha',[e.titulo,e.resumen].filter(Boolean).join(' · '));break;
      case 'estado':
        if(!T[e.id])return;enDirecto();if(state[e.id]!==e.estado)setState(e.id,e.estado);anota(e.id,e.estado,e.texto);break;
      case 'entrega':
        if(!T[e.a]||(e.de!=='door'&&!T[e.de]))return;enDirecto();
        if(e.de!=='door')anota(e.de,'done',`Envía «${e.etiqueta}» a ${T[e.a].short}.`);
        anota(e.a,'working',e.de==='door'?`Recibe «${e.etiqueta}» por la puerta.`:`Recibe «${e.etiqueta}» de ${T[e.de].short}.`);
        launch([[e.de,e.a,e.objeto||'box',e.etiqueta||'']],2000);break;
      case 'paso':enDirecto();barra(e.titulo,e.texto);break;
      case 'progreso':enDirecto();progEl.style.width=(Math.max(0,Math.min(1,+e.valor||0))*100)+'%';break;
      case 'fin':
        enDirecto();DIRECTO.fin=true;
        for(const id of ids){if(state[id]==='working'||state[id]==='blocked')setState(id,'done');else if(state[id]==='waiting')setState(id,'idle');}
        plan.classList.remove('running');logEl.classList.remove('live');progEl.style.width='100%';
        barra(e.ok===false?'Detenido':'Fin',(e.ok===false?'':'✓ ')+(e.titulo||(e.ok===false?'El trabajo se ha detenido':'Trabajo completado')));
        setTimeout(()=>showDone(e),e.repeticion?0:1200);   // tras las últimas entregas
        break;
      default:return;
    }
    refrescar();
  }
  const fuente=new EventSource(OFICINA.directo.url+(location.search||''));
  fuente.onmessage=m=>{try{aplicar(JSON.parse(m.data));}catch(err){console.warn('Evento de la oficina no válido',err);}};
  fuente.onerror=()=>{if(DIRECTO.activo&&!DIRECTO.fin)barra('Reconectando','Se ha perdido la conexión con la aplicación…');};
}

/* Puente para scripts externos (p. ej. los datos en directo de una aplicación): window.OF.
   Se avisa con el evento «oficina:lista» cuando ya está todo definido. */
window.OF={get state(){return state},setState,get LOG(){return LOG},launch,get T(){return T},get NATIVOS(){return NATIVOS},refreshPop,select,
  get selected(){return selected},render:typeof render==='function'?render:()=>{},logEl,progEl:document.getElementById('prog'),fin,showDone,hideDone,playBtn,resetAll,esc,ids,plan,reduce,
  get ahora(){return ahora},set ahora(f){ahora=f},get logHTML(){return logHTML},set logHTML(f){logHTML=f}};
window.OF_LISTA=true;window.dispatchEvent(new Event('oficina:lista'));
// Demo: con ?demo en la dirección, la simulación arranca sola (y se repite tras el informe final)
if(new URLSearchParams(location.search).has('demo')&&!(OFICINA.directo&&OFICINA.directo.url)){
  setTimeout(()=>{if(!timer)playBtn.click();},1500);
  new MutationObserver(()=>{if(!fin.hidden){clearTimeout(window.__demoRep);window.__demoRep=setTimeout(()=>{if(!fin.hidden&&!timer){hideDone();playBtn.click();}},15000);}}).observe(fin,{attributes:true,attributeFilter:['hidden']});
}
/* Integración con una aplicación (opcional, desde datos.js):
   volver: {texto, url} → botón para volver a la aplicación
   extras: ['ruta.js', …] → scripts propios que se cargan en orden al final (p. ej. datos en directo) */
if(OFICINA.volver){const a=document.createElement('a');a.className='toggle';a.id='backLink';a.href=OFICINA.volver.url||'../';a.textContent=OFICINA.volver.texto||'← Volver';
  a.style.cssText='text-decoration:none;display:inline-flex;align-items:center';document.getElementById('fsBtn').after(a);}
(function cargar(L){const u=L.shift();if(!u)return;const s=document.createElement('script');s.src=u;s.onload=s.onerror=()=>cargar(L);document.head.appendChild(s);})((OFICINA.extras||[]).slice());
</script>
